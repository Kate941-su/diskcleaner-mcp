name: Release

# v0.1.0 のようなタグを push すると、テスト → PyPI → MCP Registry → GitHub Release(.mcpb) の順に公開する
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Check that the tag matches every version field
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in \
            "$(uv version --short)" \
            "$(jq -r .version server.json)" \
            "$(jq -r '.packages[0].version' server.json)" \
            "$(jq -r .version manifest.json)"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::version $v does not match tag v$tag"; exit 1
            fi
          done
      - run: uv build
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      - run: npx -y @anthropic-ai/mcpb@2.1.2 pack . "dist-mcpb/diskclean-mcp-server-${GITHUB_REF_NAME}.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist-mcpb/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/diskclean-mcp-server/
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # MCP Registry の GitHub OIDC 認証
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5
      - name: Wait until the new version is visible on PyPI
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/diskclean-mcp-server/${GITHUB_REF_NAME#v}/json" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::package did not appear on PyPI"; exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: dist-mcpb/
      - name: Create GitHub Release with the .mcpb bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist-mcpb/*.mcpb
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
